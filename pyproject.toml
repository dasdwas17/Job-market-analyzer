[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-analyzer"
version = "0.2.0"
description = "招聘市场数据分析工具 — 薪资/技能/竞争度/求职策略分析"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Li Ming", email = "12345678+dasdwas17@users.noreply.github.com"}]
keywords = ["job-market", "recruitment", "data-analysis", "salary", "plotly"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/dasdwas17/job-market-analyzer"
Issues = "https://github.com/dasdwas17/job-market-analyzer/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["job_market_analyzer*"]
